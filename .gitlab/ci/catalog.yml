# Team C - catalog-module. Owned by the team's Scrum Master (CODEOWNERS).
# Lab 8: linter job, coverage report and artifacts of the module.
# Worked example: lint-user and build-user in .gitlab/ci/practitioner.yml.

# Each module publishes its installed jar as an artifact: the shared cache is overwritten by
# whichever parallel job finishes last, so assemble-system cannot rely on it.
# Keep the job name build-catalog: assemble-system needs it.
# ./mvnw install runs the tests, JaCoCo (report + check >= 80 % lines in domain + application)
# and installs the jar. If the coverage rule fails, this job fails and so does the pipeline.
build-catalog:
  stage: build-modules
  extends: .module-build
  needs:
    - build-core
  variables:
    MODULE: catalog-module
  artifacts:
    paths:
      - catalog-module/target/*.jar
      - catalog-module/target/site/jacoco/
      - .m2/repository/org/jala/edu/catalog-module/

# Linter (Lab 8, Activity 1): Checkstyle 14.4.0, rules in catalog-module/config/checkstyle.xml.
# The shared template .module-lint sets allow_failure: true, so it is overridden here:
# from 23/11 an infraction fails the pipeline.
lint-catalog:
  extends: .module-lint
  allow_failure: false
  variables:
    MODULE: catalog-module
    LINT_GOAL: "checkstyle:check"