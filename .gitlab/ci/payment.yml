# Team D - payment-module. Owned by the team's Scrum Master (CODEOWNERS).
# Lab 8: the team adds here the linter job, the coverage report and the artifacts of its module.
# Worked example: lint-user and build-user in .gitlab/ci/practitioner.yml.

# Each module publishes its installed jar as an artifact: the shared cache is overwritten by
# whichever parallel job finishes last, so assemble-system cannot rely on it.
# Keep the job name build-payment: assemble-system needs it.
build-payment:
  stage: build-modules
  extends: .module-build
  needs:
    - build-core
  variables:
    MODULE: payment-module
  artifacts:
    paths:
      - payment-module/target/*.jar
      - payment-module/target/site/jacoco/
      - .m2/repository/org/jala/edu/payment-module/

# Linter (Lab 8, Activity 1): Checkstyle obligatorio.
lint-payment:
  extends: .module-lint
  allow_failure: false
  variables:
    MODULE: payment-module
    LINT_GOAL: "checkstyle:check"
