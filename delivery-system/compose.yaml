services:
  mysql:
    image: mysql:8.4
    container_name: delivery-system-mysql
    environment:
      MYSQL_DATABASE: delivery_system
      MYSQL_USER: delivery
      MYSQL_PASSWORD: delivery
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
