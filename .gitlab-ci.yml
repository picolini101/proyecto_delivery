# GitLab CI for the Delivery System modular monolith.
# Each module is an independent Maven project. They are built in dependency order
# and the final delivery-system module is assembled at the end.
#
# The jobs live in .gitlab/ci/ (Lab 8): one file per team module, owned by the team's
# Scrum Master in CODEOWNERS, plus the shared templates and the practitioner's modules.

image: eclipse-temurin:25-jdk

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .m2/repository

stages:
  - lint
  - build-core
  - build-reference
  - build-modules
  - assemble

include:
  - local: .gitlab/ci/templates.yml
  - local: .gitlab/ci/practitioner.yml
  - local: .gitlab/ci/catalog.yml
  - local: .gitlab/ci/order.yml
  - local: .gitlab/ci/delivery.yml
  - local: .gitlab/ci/payment.yml
